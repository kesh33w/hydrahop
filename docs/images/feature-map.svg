<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 532" width="940" height="532" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What HydraHop adds to OpenHop</title>
<desc id="d">Channel bridge: Decrypts a mapped channel, re-encrypts it for the other network DM / ACK / PATH / TRACE cross unchanged Rate limits, echo ledger, live pause Local and crossing send policies; Multi-radio topology: Two logical networks on one Pi One transmitter per network, plus receiver and shadow radios Per-network duplicate suppression TX outcome: sent / not sent / uncertain; Double TX: TX groups: one packet, two antennas Every packet, or bridged ones only Random gap and random send order Airtime counted per antenna; Antenna identities: Per-antenna hop codes (2-byte) Hand-picked 1-byte codes, retired when a nearby relay uses the byte Alias labels in MQTT for CoreScope; Analytics: Bridge: crossings each way, why not sent Antennas: heard-by, signal gap, noise Which antenna&#x27;s copy neighbours relay CRC errors caused by our own sends; Radio control: Per-radio CAD on/off and calibration, applied after firmware confirms AGC reset interval pushed to G2/G3 Per-packet RSSI/SNR from G3 modems; Observability: One MQTT observer per radio/network Every relay path is an observation Dashboard card Last reception per radio; Internet Link (iLink): TLS sidecar to V4.3 TFT/OLED and Heltec V3 firmware Multibyte paths, approved routes only Enrollment via the home radio; Releases: Four repos tagged together (hydrahop-vX.Y.Z), exact pins Release directories, 1-line rollback Every change by PR with CI</desc>
